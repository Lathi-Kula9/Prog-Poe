name:TestJava CI
on:[push,pull_request]
jobs:
test: runs-on:ubuntu-latest
steps:-uses:actions/checkout@v4
-uses:actions/setup-java@v4
with:java-version:'21'
distribution:'temurin'
-name:Check messages.json&compile
run:| test -f messages.json mkdir -p out/main out/test lib find.-name "*Test.java"!-path"./out/">main.txt javac -d out/main @main.txt
-name:Run JUnit tests
run:|
curl -sL -o lib/junit.jar https://repo1.maven.org/maven.org/maven2/org/junit-platform-console-standalone/1.10.2/junit-console-standalone-1.10.2
find.-name"*Test.java">test.txt
javac -cp "out/main:lib/junit.jar"-d out/test @test.txt
java-jar lib/junit.jar --class-path"out/main:out/test"--scan-class-path
